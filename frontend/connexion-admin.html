<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion Administration - UniERP BF</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/login-futuristic.css">
</head>
<body>
    <div class="login-container">
        <!-- Bouton retour -->
        <a href="accueil.html" class="btn-back">
            ← Retour à l'accueil
        </a>

        <!-- Card de connexion -->
        <div class="login-card">
            <!-- Header -->
            <div class="login-header">
                <div class="login-logo">⚙️</div>
                <h1 class="login-title">Administration</h1>
                <p class="login-subtitle">Gestion complète du système</p>
            </div>

            <!-- Messages -->
            <div id="errorMessage" class="error-message"></div>
            <div id="successMessage" class="success-message"></div>

            <!-- Formulaire -->
            <form id="loginForm" class="login-form" onsubmit="handleLogin(event)">
                <!-- Email -->
                <div class="form-group">
                    <label class="form-label" for="email">Email</label>
                    <div class="input-with-icon">
                        <span class="input-icon">📧</span>
                        <input 
                            type="email" 
                            id="email" 
                            class="form-input" 
                            placeholder="admin@unierp.bf"
                            required
                            autocomplete="email"
                        >
                    </div>
                </div>

                <!-- Mot de passe -->
                <div class="form-group">
                    <label class="form-label" for="password">Mot de passe</label>
                    <div class="input-with-icon">
                        <span class="input-icon">🔒</span>
                        <input 
                            type="password" 
                            id="password" 
                            class="form-input" 
                            placeholder="••••••••"
                            required
                            autocomplete="current-password"
                        >
                    </div>
                </div>

                <!-- Remember me -->
                <div class="form-checkbox-group">
                    <input type="checkbox" id="remember" class="form-checkbox">
                    <label for="remember" class="form-checkbox-label">Se souvenir de moi</label>
                </div>

                <!-- Bouton de connexion -->
                <button type="submit" class="btn-login" id="btnLogin">
                    Se connecter
                </button>
            </form>

            <!-- Liens -->
            <div class="login-links">
                <a href="changer-mot-de-passe.html" class="login-link">Mot de passe oublié ?</a>
                <a href="inscription.html" class="login-link">Créer un compte</a>
            </div>

            <!-- Footer -->
            <div class="login-footer">
                <p>&copy; 2024 UniERP BF - Design Futuriste v8.0</p>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script>
        async function handleLogin(event) {
            event.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btnLogin = document.getElementById('btnLogin');
            const errorMessage = document.getElementById('errorMessage');
            const successMessage = document.getElementById('successMessage');

            // Reset messages
            errorMessage.classList.remove('show');
            successMessage.classList.remove('show');

            // Loading state
            btnLogin.classList.add('loading');
            btnLogin.disabled = true;

            try {
                const response = await fetch(`${CONFIG.API_URL}/auth/login/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    // Vérifier le rôle
                    const userRole = data.user?.role || data.role;
                    if (userRole === 'admin' || userRole === 'superadmin') {
                        // Sauvegarder les tokens (utiliser les mêmes clés que api.js)
                        localStorage.setItem('erp_access_token', data.access);
                        localStorage.setItem('erp_refresh_token', data.refresh);
                        localStorage.setItem('erp_user', JSON.stringify(data.user));
                        // Compatibilité avec l'ancien système
                        localStorage.setItem('access_token', data.access);
                        localStorage.setItem('refresh_token', data.refresh);
                        localStorage.setItem('user_role', userRole);
                        localStorage.setItem('user_email', email);
                        localStorage.setItem('user_data', JSON.stringify(data.user));

                        // Message de succès
                        successMessage.textContent = 'Connexion réussie ! Redirection...';
                        successMessage.classList.add('show');

                        // Redirection
                        setTimeout(() => {
                            if (userRole === 'superadmin') {
                                window.location.href = 'dashboard-superadmin.html';
                            } else {
                                window.location.href = 'dashboard-admin.html';
                            }
                        }, 1000);
                    } else {
                        throw new Error('Accès non autorisé. Cette page est réservée aux administrateurs.');
                    }
                } else {
                    throw new Error(data.error || 'Email ou mot de passe incorrect');
                }
            } catch (error) {
                errorMessage.textContent = error.message;
                errorMessage.classList.add('show');
                btnLogin.classList.remove('loading');
                btnLogin.disabled = false;
            }
        }

        // Auto-focus sur le premier champ
        document.getElementById('email').focus();
    </script>
</body>
</html>
