<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription Communication - UniERP BF</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/inscription-futuristic.css">
</head>
<body>
    <div class="inscription-container">
        <a href="accueil.html" class="btn-back">← Retour à l'accueil</a>

        <div class="inscription-card">
            <div class="inscription-header">
                <div class="inscription-logo">📢</div>
                <h1 class="inscription-title">Service Communication</h1>
                <p class="inscription-subtitle">Demande d'inscription au service</p>
            </div>

            <div id="errorMessage" class="error-message"></div>
            <div id="successMessage" class="success-message"></div>

            <form id="inscriptionForm" class="inscription-form" onsubmit="handleInscription(event)">
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="nom">Nom *</label>
                        <input type="text" id="nom" class="form-input" placeholder="Votre nom" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="prenom">Prénom *</label>
                        <input type="text" id="prenom" class="form-input" placeholder="Votre prénom" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="email">Email *</label>
                    <input type="email" id="email" class="form-input" placeholder="communication@unierp.bf" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="telephone">Téléphone</label>
                    <input type="tel" id="telephone" class="form-input" placeholder="+226 XX XX XX XX">
                </div>

                <div class="form-group">
                    <label class="form-label" for="poste_souhaite">Poste souhaité</label>
                    <input type="text" id="poste_souhaite" class="form-input" value="Chargé de communication">
                </div>

                <button type="submit" class="btn-inscription" id="btnInscription">
                    Envoyer ma demande
                </button>
            </form>

            <div class="inscription-links">
                <span style="color: #718096;">Vous avez déjà un compte ? </span>
                <a href="connexion-communication.html" class="inscription-link">Se connecter</a>
            </div>

            <div class="inscription-footer">
                <p>&copy; 2024 UniERP BF - Design Futuriste v8.0</p>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://wendlasida.pythonanywhere.com/api';

        async function handleInscription(event) {
            event.preventDefault();

            const btnInscription = document.getElementById('btnInscription');
            const errorMessage = document.getElementById('errorMessage');
            const successMessage = document.getElementById('successMessage');

            errorMessage.classList.remove('show');
            successMessage.classList.remove('show');
            btnInscription.classList.add('loading');
            btnInscription.disabled = true;

            const formData = {
                nom: document.getElementById('nom').value,
                prenom: document.getElementById('prenom').value,
                email: document.getElementById('email').value,
                telephone: document.getElementById('telephone').value,
                poste_souhaite: document.getElementById('poste_souhaite').value
            };

            try {
                const response = await fetch(`${CONFIG.API_URL}/demandes-inscription-communication/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });

                if (response.ok) {
                    successMessage.textContent = 'Demande envoyée avec succès ! Vous recevrez un email une fois votre compte validé.';
                    successMessage.classList.add('show');
                    document.getElementById('inscriptionForm').reset();
                    
                    setTimeout(() => {
                        window.location.href = 'connexion-communication.html';
                    }, 3000);
                } else {
                    const error = await response.json();
                    throw new Error(error.detail || 'Une erreur est survenue');
                }
            } catch (error) {
                errorMessage.textContent = error.message;
                errorMessage.classList.add('show');
            } finally {
                btnInscription.classList.remove('loading');
                btnInscription.disabled = false;
            }
        }

        document.getElementById('nom').focus();
    </script>
</body>
</html>
