<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion Enseignants - UniERP BF</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/login-futuristic.css">
</head>
<body>
    <div class="login-container">
        <a href="accueil.html" class="btn-back">← Retour à l'accueil</a>

        <div class="login-card">
            <div class="login-header">
                <div class="login-logo">👨‍🏫</div>
                <h1 class="login-title">Enseignants</h1>
                <p class="login-subtitle">Saisie des notes et gestion des cours</p>
            </div>

            <div id="errorMessage" class="error-message"></div>
            <div id="successMessage" class="success-message"></div>

            <form id="loginForm" class="login-form" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label class="form-label" for="email">Email</label>
                    <div class="input-with-icon">
                        <span class="input-icon">📧</span>
                        <input type="email" id="email" class="form-input" placeholder="professeur@unierp.bf" required autocomplete="email">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Mot de passe</label>
                    <div class="input-with-icon">
                        <span class="input-icon">🔒</span>
                        <input type="password" id="password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
                    </div>
                </div>

                <div class="form-checkbox-group">
                    <input type="checkbox" id="remember" class="form-checkbox">
                    <label for="remember" class="form-checkbox-label">Se souvenir de moi</label>
                </div>

                <button type="submit" class="btn-login" id="btnLogin">Se connecter</button>
            </form>

            <div class="login-links">
                <a href="changer-mot-de-passe.html" class="login-link">Mot de passe oublié ?</a>
                <a href="inscription-professeur.html" class="login-link">Créer un compte</a>
            </div>

            <div class="login-footer">
                <p>&copy; 2024 UniERP BF - Design Futuriste v8.0</p>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script>
        async function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btnLogin = document.getElementById('btnLogin');
            const errorMessage = document.getElementById('errorMessage');
            const successMessage = document.getElementById('successMessage');

            errorMessage.classList.remove('show');
            successMessage.classList.remove('show');
            btnLogin.classList.add('loading');
            btnLogin.disabled = true;

            try {
                const response = await fetch(`${CONFIG.API_URL}/login/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok && data.role === 'enseignant') {
                    localStorage.setItem('access_token', data.access);
                    localStorage.setItem('refresh_token', data.refresh);
                    localStorage.setItem('user_role', data.role);
                    localStorage.setItem('user_email', email);

                    successMessage.textContent = 'Connexion réussie ! Redirection...';
                    successMessage.classList.add('show');

                    setTimeout(() => {
                        window.location.href = 'dashboard-prof.html';
                    }, 1000);
                } else {
                    throw new Error(data.error || 'Email ou mot de passe incorrect');
                }
            } catch (error) {
                errorMessage.textContent = error.message;
                errorMessage.classList.add('show');
                btnLogin.classList.remove('loading');
                btnLogin.disabled = false;
            }
        }

        document.getElementById('email').focus();
    </script>
</body>
</html>
